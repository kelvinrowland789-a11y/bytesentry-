<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buy Airtime – ByteSentry</title>
<meta name="theme-color" content="#08111F">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=airtime-network-2">
</head>
<body data-page="airtime">
<main>
<form class="card" id="form" novalidate>
  <div class="step"><b>1</b><h3>Network</h3></div>
  <div id="nets"></div>
  <p class="selected-network" id="selected-network" aria-live="polite">Selected network: MTN</p>
  <div class="step"><b>2</b><h3>Amount</h3></div>
  <label class="lab" for="amt">How much airtime?</label>
  <input id="amt" class="input big" type="text" inputmode="numeric" maxlength="6" placeholder="₦0" autocomplete="off">
  <div class="presets" role="group" aria-label="Quick amounts">
    <button type="button" class="preset" data-v="100">₦100</button><button type="button" class="preset" data-v="200">₦200</button>
    <button type="button" class="preset" data-v="500">₦500</button><button type="button" class="preset" data-v="1000">₦1,000</button>
  </div>
  <div class="pay-box gap"><span>You pay</span><strong id="pay">₦0</strong></div>
  <div class="step"><b>3</b><h3>Recipient</h3></div>
  <label class="lab" for="phone">Phone number</label>
    <input id="phone" class="input" type="tel" inputmode="numeric" maxlength="11" autocomplete="tel-national" placeholder="08031234567">
  <label class="lab gap" for="pin">Transaction PIN</label>
    <input id="pin" class="input pin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="••••">
  <p class="err" id="err" role="alert" hidden></p>
  <button class="btn btn-primary" id="buy" type="submit">Buy airtime</button>
</form>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=airtime-network-2"></script>
</body>
</html>
