<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Add Money – ByteSentry</title>
<meta name="theme-color" content="#08111F">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css?v=fund-status-green-1">
</head>
<body data-page="fund">
<main>
<form class="card" id="form" novalidate>
  <p class="err" id="banner" hidden></p>
  <div class="step"><b>1</b><h3>Amount</h3></div>
  <label class="lab" for="amt">How much do you want to add?</label>
  <input id="amt" class="input big" type="text" inputmode="numeric" maxlength="6" placeholder="₦0" autocomplete="off">
  <div class="presets" role="group" aria-label="Quick amounts">
    <button type="button" class="preset" data-v="500">₦500</button><button type="button" class="preset" data-v="1000">₦1,000</button>
    <button type="button" class="preset" data-v="2000">₦2,000</button><button type="button" class="preset" data-v="5000">₦5,000</button>
  </div>
  <p class="note">You'll pay securely on Paystack. Your wallet is credited as soon as the payment is confirmed.</p>
  <p class="note"><a class="linkbtn" href="payments.html">View your payments</a></p>
  <p class="err" id="err" role="alert" hidden></p>
  <button class="btn btn-primary" id="buy" type="submit">Pay securely</button>
</form>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js?v=fund-status-green-1"></script>
</body>
</html>
